name: 编译·签名·发布

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'firmware/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'firmware/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE: "25.12.6"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"id":"x86/64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"id":"x86/64"},{"id":"rockchip/armv8"},{"id":"bcm27xx/bcm2711"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip wget file \
            zlib1g-dev zstd patch perl

      - name: 恢复下载缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/sdk/*/dl
            ~/sdk/*.tar.zst
          key: dl-${{ matrix.id }}-${{ hashFiles('build/packages.list') }}
          restore-keys: |
            dl-${{ matrix.id }}-

      - name: 编译收录包
        run: bash scripts/build.sh "${{ matrix.id }}"

      - name: 保存下载缓存（失败也存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/sdk/*/dl
            ~/sdk/*.tar.zst
          key: dl-${{ matrix.id }}-${{ hashFiles('build/packages.list') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ strategy.job-index }}
          path: dist/
          retention-days: 7

      - name: 签名并组装软件源（本架构）
        env:
          OPENWRT_APK_PRIVATE_KEY: ${{ secrets.OPENWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -z "$OPENWRT_APK_PRIVATE_KEY" ]; then
            echo "缺少签名密钥，跳过签名"; exit 0
          fi
          printf '%s\n' "$OPENWRT_APK_PRIVATE_KEY" > /tmp/hih-priv.pem
          APK_SIGN_KEY=/tmp/hih-priv.pem bash scripts/repo.sh

      - if: hashFiles('repo/hih.pem') != ''
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ strategy.job-index }}
          path: repo/
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: repo/
          merge-multiple: true

      - name: 校验软件源结构
        run: find repo -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4